version: "3.8"

services:
  # 스팸 분석기 서비스
  spam_analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spam_analyzer_web
    restart: always
    ports:
      - "3000:3000" # Next.js 포트
      - "5001:5001" # Flask 서버 포트
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/spam_analyzer}
      - FLASK_SERVER_URL=${FLASK_SERVER_URL:-http://0.0.0.0:5001}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
    volumes:
      - ./data:/app/data
    depends_on:
      - mongo
    networks:
      - spam_analyzer_network
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    watch:
      - path: ./flask-server
        target: /app/flask-server
        action: sync
      - path: ./pages
        target: /app/pages
        action: sync
      - path: ./components
        target: /app/components
        action: sync
      - path: ./public
        target: /app/public
        action: sync

  # MongoDB 서비스
  mongo:
    image: mongo:4.4
    container_name: mongo_db
    restart: always
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - spam_analyzer_network

networks:
  spam_analyzer_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
