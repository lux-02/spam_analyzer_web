version: "3.8"

services:
  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live:/etc/letsencrypt/live
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive
    depends_on:
      - spam_analyzer
    networks:
      - spam_analyzer_network

  # 스팸 분석기 서비스
  spam_analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spam_analyzer_web
    restart: always
    ports:
      - "3000:3000"
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/spam_analyzer}
      - FLASK_SERVER_URL=${FLASK_SERVER_URL:-http://0.0.0.0:5001}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
    volumes:
      - ./data:/app/data
      - ./flask-server:/app/flask-server
      - ./pages:/app/pages
      - ./components:/app/components
      - ./public:/app/public
      - /app/node_modules
      - /app/.next
    depends_on:
      - mongo
    networks:
      - spam_analyzer_network
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # MongoDB 서비스
  mongo:
    image: mongo:4.4
    container_name: mongo_db
    restart: always
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - spam_analyzer_network

networks:
  spam_analyzer_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
