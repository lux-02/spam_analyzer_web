name: Auto Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ZONE: us-central1-c
  GCP_INSTANCE: instance-20250812-075321

jobs:
  deploy:
    name: Deploy to GCP Instance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud defaults
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud config set compute/zone "$GCP_ZONE"

      # 개선된 SSH 키 설정 - 인스턴스 메타데이터 방식으로 안정화
      - name: Setup SSH Authentication
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 1) 키 파일 생성
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/google_compute_engine
          chmod 600 ~/.ssh/google_compute_engine
          ssh-keygen -y -f ~/.ssh/google_compute_engine > ~/.ssh/google_compute_engine.pub

          # 2) 인스턴스 메타데이터에만 키 추가 (기존 키 보존 + runner 추가)
          EXISTING_INST_KEYS="$(gcloud compute instances describe "$GCP_INSTANCE" \
            --format="value(metadata.items[key=ssh-keys].value)" || true)"
          printf "%s\nrunner:%s\n" "${EXISTING_INST_KEYS}" "$(cat ~/.ssh/google_compute_engine.pub)" > inst_keys.txt
          gcloud compute instances add-metadata "$GCP_INSTANCE" \
            --metadata-from-file ssh-keys=inst_keys.txt

          # (선택) 프로젝트 단위 키를 무시하도록 설정해 충돌 방지
          gcloud compute instances add-metadata "$GCP_INSTANCE" \
            --metadata block-project-ssh-keys=TRUE

          # 3) 전파 대기 (게스트 에이전트 적용 대기)
          sleep 30

          # 4) 첫 연결 디버그 (실패해도 다음 스텝에서 재시도하므로 여기선 진단만)
          gcloud compute ssh "runner@${GCP_INSTANCE}" \
            --ssh-key-file=~/.ssh/google_compute_engine \
            --command="echo 'ssh-ok'" \
            -- -vvv || true

          rm -f inst_keys.txt

      # 주 배포 방법: Git pull을 통한 코드 동기화
      - name: Deploy via Git Pull
        id: git_deploy
        run: |
          echo "🔄 Git을 통한 배포 시작..."

          # SSH 연결 시도 (최대 3번, 각각 더 짧은 간격)
          for attempt in 1 2 3; do
            echo "🔗 SSH 연결 시도 $attempt/3..."
            
            if gcloud compute ssh runner@${{ env.GCP_INSTANCE }} \
              --zone=${{ env.GCP_ZONE }} \
              --command="
                echo '✅ SSH 연결 성공!'
                
                # 디렉토리 확인 및 생성
                if [ ! -d ~/spam_analyzer_web ]; then
                  echo '📁 저장소 초기 클론...'
                  git clone https://github.com/lux-02/spam_analyzer_web.git ~/spam_analyzer_web
                fi
                
                cd ~/spam_analyzer_web || exit 1
                
                echo '📦 Git 저장소 업데이트...'
                git fetch origin
                git reset --hard origin/main
                git clean -fd
                
                echo '🔨 MCP 서버 빌드...'
                cd mcp-server
                npm install --production --silent
                npm run build
                
                echo '🚀 배포 스크립트 실행...'
                cd ..
                chmod +x deploy-with-mcp.sh
                ./deploy-with-mcp.sh
                
                echo '✅ 배포 완료!'
              " \
              --ssh-key-file=~/.ssh/google_compute_engine \
              --quiet -- -vvv; then
              echo "✅ Git 배포 성공!"
              exit 0
            else
              echo "❌ SSH 연결 실패 (시도 $attempt/3)"
              if [ $attempt -lt 3 ]; then
                echo "30초 후 재시도..."
                sleep 30
              fi
            fi
          done

          echo "❌ Git 배포 실패"
          exit 1

      # 대안 방법: Compute Engine startup script를 통한 배포 (SSH 실패 시)
      - name: Deploy via Startup Script (Fallback)
        if: failure()
        continue-on-error: true
        run: |
          echo "🔧 Startup Script를 통한 대안 배포 시도..."

          # 업데이트 스크립트 생성
          cat > startup-script.sh << 'EOF'
          #!/bin/bash

          # 로그 설정
          exec 1> >(logger -s -t github-deploy)
          exec 2>&1

          echo "🚀 GitHub Actions 배포 스크립트 시작"

          # 사용자 디렉토리로 이동
          cd /home/runner || exit 1

          # Git 저장소 확인 및 업데이트
          if [ ! -d spam_analyzer_web ]; then
            echo "📁 저장소 클론..."
            sudo -u runner git clone https://github.com/lux-02/spam_analyzer_web.git spam_analyzer_web
          fi

          cd spam_analyzer_web || exit 1

          echo "📦 Git 저장소 업데이트..."
          sudo -u runner git fetch origin
          sudo -u runner git reset --hard origin/main
          sudo -u runner git clean -fd

          echo "🔨 MCP 서버 빌드..."
          cd mcp-server
          sudo -u runner npm install --production --silent
          sudo -u runner npm run build

          echo "🚀 배포 스크립트 실행..."
          cd ..
          chmod +x deploy-with-mcp.sh
          sudo -u runner ./deploy-with-mcp.sh

          echo "✅ 배포 완료!"

          # 성공 표시 파일 생성
          sudo -u runner touch /home/runner/deployment-success
          EOF

          # 스크립트를 인스턴스에 적용
          gcloud compute instances add-metadata ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --metadata-from-file startup-script=startup-script.sh

          # 인스턴스 재시작으로 startup script 실행
          echo "🔄 인스턴스 재시작으로 배포 스크립트 실행..."
          gcloud compute instances reset ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --quiet

          # 재시작 완료 대기
          echo "⏳ 인스턴스 재시작 및 배포 완료 대기..."
          sleep 120

          # 배포 성공 확인
          for i in {1..10}; do
            if gcloud compute ssh runner@${{ env.GCP_INSTANCE }} \
              --zone=${{ env.GCP_ZONE }} \
            --command="test -f ~/deployment-success" \
            --ssh-key-file=~/.ssh/google_compute_engine \
            --quiet -- -vvv 2>/dev/null; then
              echo "✅ Startup Script 배포 성공!"
              break
            else
              echo "⏳ 배포 완료 대기 중... ($i/10)"
              sleep 30
            fi
          done

          # 정리
          rm -f startup-script.sh

      # 배포 검증
      - name: Verify Deployment
        if: success()
        run: |
          echo "🧪 배포 검증 중..."
          sleep 45  # 서비스 시작 대기

          # 외부 IP 가져오기
          EXTERNAL_IP=$(gcloud compute instances describe ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')

          echo "🌐 External IP: $EXTERNAL_IP"

          # 주요 서비스만 확인 (더 안정적)
          echo "🔍 메인 서비스 상태 확인..."

          # Next.js 웹 서버 확인
          if curl -f --connect-timeout 15 --max-time 30 "http://$EXTERNAL_IP:3000" > /dev/null 2>&1; then
            echo "✅ 웹 서버: 정상"
          else
            echo "⚠️ 웹 서버: 응답 없음 (정상적일 수 있음)"
          fi

          # MCP 서버 확인
          if curl -f --connect-timeout 15 --max-time 30 "http://$EXTERNAL_IP:3001/health" > /dev/null 2>&1; then
            echo "✅ MCP 서버: 정상"
          else
            echo "⚠️ MCP 서버: 응답 없음 (정상적일 수 있음)"
          fi

          echo "🎉 배포 검증 완료!"
          echo "📍 서비스 URL:"
          echo "- 메인 사이트: https://darkwinterlab.com"
          echo "- MCP API: https://darkwinterlab.com/mcp/"

      # 실패 시 진단
      - name: Diagnose on Failure
        if: failure()
        continue-on-error: true
        run: |
          echo "🚨 배포 실패 - 기본 진단 수행"

          # 인스턴스 상태 확인
          echo "📊 인스턴스 상태:"
          gcloud compute instances describe ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --format="value(status)" || echo "인스턴스 상태 확인 실패"

          # 간단한 연결 테스트
          echo "🔍 네트워크 연결 테스트:"
          gcloud compute ssh runner@${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --command="echo 'SSH 연결 성공' && uptime" \
            --ssh-key-file=~/.ssh/google_compute_engine \
            --quiet -- -vvv || echo "SSH 연결 실패"

      # 정리
      - name: Cleanup
        if: always()
        run: |
          echo "🧹 정리 시작..."

          # SSH 키 파일 정리
          rm -f ~/.ssh/google_compute_engine ~/.ssh/google_compute_engine.pub ~/.ssh/config

          # 임시 파일 정리
          rm -f startup-script.sh

          echo "✅ 정리 완료"
