name: Auto Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ZONE: us-central1-c
  GCP_INSTANCE: instance-20250812-075321

jobs:
  deploy:
    name: Deploy to GCP Instance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

    # SSH 키 전파 문제를 해결하는 개선된 방법
    - name: Setup SSH with retry mechanism
      run: |
        echo "🔑 SSH 키 설정 시작..."
        
        # SSH 키 설정
        mkdir -p ~/.ssh
        echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/google_compute_engine
        chmod 600 ~/.ssh/google_compute_engine
        
        # 공개 키 생성 (개인 키로부터)
        ssh-keygen -y -f ~/.ssh/google_compute_engine > ~/.ssh/google_compute_engine.pub
        echo "✅ SSH 키 생성 완료"
        
        # OS Login 비활성화 (중요!)
        echo "🔒 OS Login 비활성화..."
        gcloud compute project-info add-metadata --metadata enable-oslogin=FALSE
        
        # 기존 SSH 키 메타데이터 가져오기
        echo "📋 기존 SSH 키 확인..."
        gcloud compute project-info describe --format="value(commonInstanceMetadata.items[key=ssh-keys].value)" > current_keys.txt 2>/dev/null || touch current_keys.txt
        
        # runner 키 제거 (있다면)
        grep -v "^runner:" current_keys.txt > temp_keys.txt 2>/dev/null || touch temp_keys.txt
        
        # 새 키 추가
        echo "runner:$(cat ~/.ssh/google_compute_engine.pub)" >> temp_keys.txt
        
        # 빈 줄 제거 후 메타데이터 업데이트
        grep -v "^$" temp_keys.txt > final_keys.txt
        echo "📝 SSH 키 메타데이터 업데이트..."
        gcloud compute project-info add-metadata --metadata-from-file ssh-keys=final_keys.txt
        
        # SSH 설정
        cat > ~/.ssh/config << EOF
        Host *
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          ServerAliveInterval 60
          ServerAliveCountMax 10
          ConnectTimeout 30
          IdentitiesOnly yes
        EOF
        chmod 600 ~/.ssh/config
        
        echo "⏳ SSH 키 전파 대기 (120초)..."
        sleep 120
        
        # 정리
        rm -f current_keys.txt temp_keys.txt final_keys.txt

      # 대안 1: Git pull을 통한 코드 동기화 (가장 안전)
      - name: Deploy via Git pull (Method 1)
        id: git_deploy
        continue-on-error: true
        run: |
          echo "🔄 Git을 통한 배포 시작..."
          
          # 최대 2번 시도 (이미 120초 대기함)
          for attempt in 1 2; do
            echo "🔗 SSH 연결 시도 $attempt/2..."
            
            if gcloud compute ssh runner@${{ env.GCP_INSTANCE }} \
              --zone=${{ env.GCP_ZONE }} \
              --command="
                echo '✅ SSH 연결 성공!'
                cd ~/spam_analyzer_web || exit 1
                
                echo '📦 Git 저장소 업데이트...'
                git fetch origin
                git reset --hard origin/main
                
                echo '🔨 MCP 서버 빌드...'
                cd mcp-server
                npm install --production
                npm run build
                
                echo '🚀 배포 스크립트 실행...'
                cd ..
                chmod +x deploy-with-mcp.sh
                ./deploy-with-mcp.sh
                
                echo '✅ 배포 완료!'
              " \
              --ssh-key-file=~/.ssh/google_compute_engine \
              --quiet; then
              echo "✅ Git 배포 성공!"
              exit 0
            else
              echo "❌ SSH 연결 실패 (시도 $attempt/2)"
              if [ $attempt -lt 2 ]; then
                echo "60초 후 재시도..."
                sleep 60
              fi
            fi
          done
          
          echo "❌ Git 배포 실패 - Cloud Storage 방법으로 진행"
          exit 1

      # 대안 2: Cloud Storage를 통한 배포 (Git 방법 실패 시)
      - name: Deploy via Cloud Storage (Method 2)
        if: steps.git_deploy.outcome == 'failure'
        run: |
          echo "📦 Cloud Storage를 통한 배포 시작..."
          
          # 임시 버킷 생성
          BUCKET_NAME="${{ env.GCP_PROJECT_ID }}-temp-deploy"
          gsutil mb gs://$BUCKET_NAME 2>/dev/null || echo "버킷이 이미 존재합니다."
          
          # 소스 코드 압축
          echo "🗜️ 소스 코드 압축 중..."
          tar --exclude='.git' \
              --exclude='node_modules' \
              --exclude='mcp-server/node_modules' \
              --exclude='mcp-server/dist' \
              --exclude='flask-server/venv' \
              -czf source-code.tar.gz .
          
          # Cloud Storage에 업로드
          echo "☁️ Cloud Storage에 업로드 중..."
          gsutil cp source-code.tar.gz gs://$BUCKET_NAME/
          
          # 배포 스크립트를 더 간단하게 만들기
          echo "🚀 Cloud Storage 배포 실행..."
          
          # SSH 연결 시도 (Cloud Storage 방법으로)
          SUCCESS=false
          for attempt in 1 2 3; do
            echo "🔗 Cloud Storage 배포 시도 $attempt/3..."
            
            if gcloud compute ssh runner@${{ env.GCP_INSTANCE }} \
              --zone=${{ env.GCP_ZONE }} \
              --command="
                echo '📥 Cloud Storage에서 코드 다운로드...'
                gsutil cp gs://$BUCKET_NAME/source-code.tar.gz ~/
                
                echo '📁 기존 코드 백업...'
                if [ -d ~/spam_analyzer_web ]; then
                  mv ~/spam_analyzer_web ~/spam_analyzer_web_backup_\$(date +%Y%m%d_%H%M%S)
                fi
                
                echo '📦 새 코드 추출...'
                mkdir -p ~/spam_analyzer_web
                tar -xzf ~/source-code.tar.gz -C ~/spam_analyzer_web
                
                echo '🔨 빌드 및 배포...'
                cd ~/spam_analyzer_web
                chmod +x deploy-with-mcp.sh
                ./deploy-with-mcp.sh
                
                echo '🧹 정리...'
                rm ~/source-code.tar.gz
                
                echo '✅ 배포 완료!'
              " \
              --ssh-key-file=~/.ssh/google_compute_engine; then
              echo "✅ Cloud Storage 배포 성공!"
              SUCCESS=true
              break
            else
              echo "❌ Cloud Storage 배포 실패 (시도 $attempt/3)"
              if [ $attempt -lt 3 ]; then
                echo "30초 후 재시도..."
                sleep 30
              fi
            fi
          done
          
          # 임시 파일 정리
          gsutil rm gs://$BUCKET_NAME/source-code.tar.gz 2>/dev/null || true
          rm -f source-code.tar.gz
          
          if [ "$SUCCESS" = "false" ]; then
            echo "🚨 Cloud Storage 배포도 실패. 최후 방법 시도..."
            
            # 마지막 시도: gcloud compute instances run-script
            echo "🔧 최후 방법: 스크립트 직접 실행..."
            
            # 간단한 업데이트 스크립트 생성
            cat > final_update.sh << 'SCRIPT'
            #!/bin/bash
            cd ~/spam_analyzer_web || exit 1
            git fetch origin && git reset --hard origin/main
            cd mcp-server && npm install --production && npm run build
            cd .. && chmod +x deploy-with-mcp.sh && ./deploy-with-mcp.sh
            SCRIPT
            
            # 스크립트 업로드 및 실행
            gsutil cp final_update.sh gs://$BUCKET_NAME/
            
            gcloud compute ssh runner@${{ env.GCP_INSTANCE }} \
              --zone=${{ env.GCP_ZONE }} \
              --command="gsutil cp gs://$BUCKET_NAME/final_update.sh ~/ && chmod +x ~/final_update.sh && ~/final_update.sh" \
              --ssh-key-file=~/.ssh/google_compute_engine || echo "최후 방법도 실패"
              
            gsutil rm gs://$BUCKET_NAME/final_update.sh 2>/dev/null || true
            rm -f final_update.sh
          fi

      # 배포 검증
      - name: Verify deployment
        run: |
          echo "🧪 배포 검증 중..."
          sleep 30  # 서비스 시작 대기

          # 외부 IP 가져오기
          EXTERNAL_IP=$(gcloud compute instances describe ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')

          echo "🌐 External IP: $EXTERNAL_IP"

          # 서비스 헬스 체크
          SERVICES=("3000" "5001" "3001")
          SERVICE_NAMES=("Next.js" "Flask API" "MCP Server")

          for i in {0..2}; do
            PORT=${SERVICES[$i]}
            NAME=${SERVICE_NAMES[$i]}
            
            echo "🔍 $NAME (포트 $PORT) 확인 중..."
            
            for attempt in 1 2 3; do
              if curl -f --connect-timeout 10 "http://$EXTERNAL_IP:$PORT" > /dev/null 2>&1 || \
                 curl -f --connect-timeout 10 "http://$EXTERNAL_IP:$PORT/health" > /dev/null 2>&1; then
                echo "✅ $NAME: 정상"
                break
              else
                echo "❌ $NAME: 실패 (시도 $attempt/3)"
                if [ $attempt -eq 3 ]; then
                  echo "🚨 $NAME 서비스 검증 실패!"
                else
                  sleep 10
                fi
              fi
            done
          done

          echo "🎉 배포 검증 완료!"
          echo "📍 서비스 URL:"
          echo "- 메인 사이트: https://darkwinterlab.com"
          echo "- MCP API: https://darkwinterlab.com/mcp/"

      # 실패 시 알림
      - name: Notify on failure
        if: failure()
        run: |
          echo "🚨 배포 실패!"
          echo "자세한 로그는 GitHub Actions에서 확인하세요."

          # 실패 시 서버 상태 확인
          gcloud compute ssh runner@${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --command="
              echo '📊 서버 상태:'
              ps aux | grep -E '(node|npm|pm2)' | head -10
              echo '📁 디스크 사용량:'
              df -h
              echo '💾 메모리 사용량:'
              free -h
            " \
            --ssh-key-file=~/.ssh/google_compute_engine || echo "서버 상태 확인 실패"

      # 정리
      - name: Cleanup
        if: always()
        run: |
          # 로컬 임시 파일 정리
          rm -f source-code.tar.gz deploy_script.sh final_deploy_script.sh current_keys.txt

          # SSH 키 정리
          rm -f ~/.ssh/google_compute_engine ~/.ssh/google_compute_engine.pub

          echo "🧹 정리 완료"
