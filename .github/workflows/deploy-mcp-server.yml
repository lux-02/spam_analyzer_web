name: Deploy MCP Server to GCP

on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - ".github/workflows/deploy-mcp-server.yml"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ZONE: us-central1-c
  GCP_INSTANCE: instance-20250812-075321

jobs:
  deploy:
    name: Deploy MCP Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./mcp-server/package-lock.json"

      - name: Install dependencies
        working-directory: ./mcp-server
        run: npm ci

      - name: Build TypeScript
        working-directory: ./mcp-server
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud defaults
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud config set compute/zone "$GCP_ZONE"

      - name: Enable required APIs
        run: |
          gcloud services enable cloudresourcemanager.googleapis.com compute.googleapis.com --project "$GCP_PROJECT_ID"

      - name: Enable OS Login on the instance
        run: |
          gcloud compute instances add-metadata "$GCP_INSTANCE" \
            --zone "$GCP_ZONE" \
            --metadata enable-oslogin=TRUE

      - name: Print OS Login / metadata (non-blocking)
        run: |
          echo "Project enable-oslogin:"
          gcloud compute project-info describe --format="get(commonInstanceMetadata.items.enable-oslogin)" || true
          echo "Instance enable-oslogin:"
          gcloud compute instances describe "$GCP_INSTANCE" --format="get(metadata.items.enable-oslogin)" || true
          echo "Instance block-project-ssh-keys:"
          gcloud compute instances describe "$GCP_INSTANCE" --format="get(metadata.items.block-project-ssh-keys)" || true

      - name: Copy build (OS Login)
        run: |
          tar -czf mcp-server-build.tar.gz -C ./mcp-server .
          gcloud --verbosity=debug compute scp \
            mcp-server-build.tar.gz "${GCP_INSTANCE}:~/" \
            --zone="$GCP_ZONE" --quiet

      # 서버 재시작 및 설정 (npx pm2, show logs on fail)
      - name: Deploy and restart server (npx pm2, show logs on fail)
        run: |
          gcloud --verbosity=debug compute ssh "${GCP_INSTANCE}" --zone="$GCP_ZONE" -- -vvv -- bash -lc '
            set -euxo pipefail

            REPO_DIR="$HOME/spam_analyzer_web/mcp-server"
            mkdir -p "$REPO_DIR"

            # 새 아티팩트 적용
            tar -xzf "$HOME/mcp-server-build.tar.gz" -C "$REPO_DIR"
            rm -f "$HOME/mcp-server-build.tar.gz"

            cd "$REPO_DIR"

            # npm 로그 폴더 초기화
            LOGDIR="$HOME/.npm/_logs"
            rm -rf "$LOGDIR" || true
            mkdir -p "$LOGDIR"

            # 의존성 설치 (락파일 있으면 ci, 없으면 install)
            if [ -f package-lock.json ]; then
              npm ci --omit=dev || {
                echo "❌ npm ci 실패. 최신 로그 출력:"; ls -l "$LOGDIR" || true
                tail -n +1 -v "$LOGDIR"/* || true
                exit 1
              }
            else
              npm install --production || {
                echo "❌ npm install 실패. 최신 로그 출력:"; ls -l "$LOGDIR" || true
                tail -n +1 -v "$LOGDIR"/* || true
                exit 1
              }
            fi

            # 엔트리 자동 탐지
            if [ -f "./start-http-server.js" ]; then
              ENTRY="./start-http-server.js"
            elif [ -f "./dist/index.js" ]; then
              ENTRY="./dist/index.js"
            else
              echo "❌ 엔트리 파일 없음 (start-http-server.js 또는 dist/index.js)"; ls -la
              exit 1
            fi

            # 글로벌 설치 대신 로컬 pm2 사용
            if ! npm ls pm2 --depth=0 >/dev/null 2>&1; then
              npm i pm2 --save || {
                echo "❌ pm2 설치 실패. 로그:"; ls -l "$LOGDIR" || true
                tail -n +1 -v "$LOGDIR"/* || true
                exit 1
              }
            fi

            npx pm2 stop mcp-server 2>/dev/null || true
            npx pm2 delete mcp-server 2>/dev/null || true
            npx pm2 start "$ENTRY" --name mcp-server
            npx pm2 save

            # 헬스체크
            sleep 5
            curl -f http://localhost:3001/health
          '

      # 배포 성공 확인
      - name: Verify deployment
        run: |
          echo "Waiting for service to be fully ready..."
          sleep 10

          # 외부에서 헬스 체크
          EXTERNAL_IP=$(gcloud compute instances describe ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')

          echo "External IP: $EXTERNAL_IP"
          echo "Testing health endpoint..."

          # 헬스 체크 (최대 5번 시도)
          for i in {1..5}; do
            if curl -f "http://$EXTERNAL_IP:3001/health"; then
              echo "✅ Health check passed!"
              break
            else
              echo "❌ Health check failed (attempt $i/5)"
              if [ $i -eq 5 ]; then
                echo "🚨 Deployment verification failed!"
                exit 1
              fi
              sleep 10
            fi
          done

          echo "🎉 MCP Server is now accessible at https://darkwinterlab.com/mcp/"

      # 실패 시 상세 원인 캡처
      - name: Print remote npm logs on failure
        if: failure()
        run: |
          gcloud --verbosity=debug compute ssh "${GCP_INSTANCE}" --zone="$GCP_ZONE" -- -vvv -- bash -lc '
            LOGDIR="$HOME/.npm/_logs"
            echo "== npm logs =="
            ls -l "$LOGDIR" || true
            tail -n +1 -v "$LOGDIR"/* || true

            echo "== pm2 status =="
            npx pm2 status || true
          '

      # 실패 시 롤백
      - name: Rollback on failure
        if: failure()
        run: |
          echo "🔄 Starting rollback process..."
          gcloud --verbosity=debug compute ssh "${GCP_INSTANCE}" --zone="$GCP_ZONE" -- -vvv -- bash -lc '
            set -euxo pipefail
            LATEST_BACKUP=$(ls -1t ~/mcp-server-backup-* 2>/dev/null | head -n1 || true)
            if [ -n "$LATEST_BACKUP" ]; then
              rm -rf ~/spam_analyzer_web/mcp-server || true
              cp -r "$LATEST_BACKUP" ~/spam_analyzer_web/mcp-server
              cd ~/spam_analyzer_web/mcp-server
              pm2 restart mcp-server || pm2 start start-http-server.js --name mcp-server
              echo "✅ Rollback completed"
            else
              echo "❌ No backup found for rollback"
            fi
          ' || echo "Rollback failed"

      # 정리
      - name: Cleanup
        if: always()
        run: |
          # 로컬 임시 파일 정리
          rm -f mcp-server-build.tar.gz

          echo "🧹 Cleanup completed"
